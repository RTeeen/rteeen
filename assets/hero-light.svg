<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" xml:space="preserve" role="img" aria-label="rteeen: software engineer">
<title>rteeen: software engineer</title>
<style>

    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .src rect { fill: #f6f8fa; stroke: #d0d7de; }
    .src text { fill: #59636e; font-size: 13px; }
    .wire { fill: none; stroke: #e4e8ec; stroke-width: 2; }
    .flow { fill: none; stroke: #d0d7de; stroke-width: 2; stroke-dasharray: 2 6;
             animation: dash 1.2s linear infinite; }
    .pkt { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 0 100;
            animation: pkt 2.4s cubic-bezier(.5,0,.5,1) infinite both; }
    .ring { fill: none; stroke: #7c3aed; stroke-width: 1.5; stroke-dasharray: 4 7;
             transform-origin: 350px 150px; animation: spin 14s linear infinite; }
    .core { fill: #f6f8fa; stroke: #7c3aed; stroke-width: 2;
             transform-origin: 350px 150px; animation: pulse 2.4s ease-in-out infinite; }
    .wh { fill: #f6f8fa; stroke: #0891b2; stroke-width: 2; }
    .lbl { fill: #59636e; font-size: 11px; letter-spacing: .08em; }
    .name { fill: #1f2328; font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
    .role { fill: #0891b2; font-size: 15px; }
    .tag { fill: #59636e; font-size: 12px; }
    .caret { fill: #059669; animation: blink 1s steps(1) infinite; }
    @keyframes dash { to { stroke-dashoffset: -8; } }
    @keyframes pkt { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    @keyframes blink { 50% { opacity: 0; } }
    
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .motion { display: none; } }
</style>
